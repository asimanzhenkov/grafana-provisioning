apiVersion: 1
datasources:
  - name: "Loki (prod)"
    type: loki
    uid: loki-prod-main
    url: "${LOKI_PROD_URL}"
    access: proxy
    jsonData:
      timeout: 60
      maxLines: 5000
      derivedFields:
        - datasourceUid: tempo-prod-main
          matcherRegex: "traceID=(\\w+)"
          name: traceID
          url: "${__value.raw}"
